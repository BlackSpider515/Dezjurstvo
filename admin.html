<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Дежурства — админка</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%9B%A0%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
  <div class="app">

    <header class="topbar">
      <div class="topbar-main">
        <div class="topbar-head">
          <h1 id="app-title">Дежурства группы</h1>
          <!-- Сюда app.js ставит счётчик «до лета» и выбор цвета -->
          <span id="summer-mount"></span>
          <span id="theme-mount"></span>
        </div>
        <p class="subtitle" id="app-subtitle">Режим администратора</p>
      </div>
      <div class="topbar-actions" id="auth-slot"></div>
    </header>

    <!-- Экран входа. Пока администратор не вошёл, ничего больше не показывается. -->
    <section class="card gate" id="gate" hidden></section>
    <section class="card" id="loading" hidden><p class="muted">Проверяем доступ…</p></section>

    <div id="notice" class="notice" hidden></div>

    <section class="card highlight" id="current-card" hidden>
      <p class="muted">Загрузка…</p>
    </section>

    <!-- Карточка «Кто дежурит дальше» -->
    <section class="card" id="next-card" hidden></section>

    <main id="content" hidden>
      <!-- Переключатель недель (только в админке) -->
      <section class="card week-switcher-card" id="week-switcher"></section>

      <nav class="tabs" id="tabs">
        <button type="button" class="tab" data-action="tab" data-tab="week">Расписание</button>
        <button type="button" class="tab" data-action="tab" data-tab="stats">Статистика</button>
        <button type="button" class="tab" data-action="tab" data-tab="history">История</button>
        <button type="button" class="tab" data-action="tab" data-admin-only data-tab="manage" hidden>Люди и пары</button>
      </nav>

      <section class="tabpanel" id="panel-week"></section>
      <section class="tabpanel" id="panel-stats" hidden></section>
      <section class="tabpanel" id="panel-history" hidden></section>
      <section class="tabpanel" id="panel-manage" hidden></section>
    </main>

    <footer class="footer">
      <span>Расписание обновляется в реальном времени.</span>
      <span class="muted small">Изменения видны всем сразу.</span>
    </footer>

  </div>

  <div id="toast" class="toast" hidden></div>

  <noscript>
    <p style="padding:16px;font-family:sans-serif">
      Для работы сайта нужен включённый JavaScript.
    </p>
  </noscript>

  <script type="module" src="app.js"></script>
</body>
</html>
